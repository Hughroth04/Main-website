# Cloudflare Pages configuration for click tracking
# The D1 database must be created manually in the Cloudflare Dashboard
# and bound to this Pages project.

name = "hughroth-com"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "hughroth-clicks"
database_id = "placeholder-create-in-dashboard"
